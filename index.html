<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAA D-I Basketball TV Ticker</title><style>html,body{margin:0;height:100%;background:#080e1b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}header{height:12vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:#17243a;box-sizing:border-box}h1{font-size:3vw;margin:0}#updated{font-size:1.3vw;color:#b7c8dd}#viewport{height:88vh;overflow:hidden;position:relative}#track{position:absolute;width:100%;top:0;will-change:transform}.game{min-height:13vh;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:1vh 3vw;border-bottom:1px solid #344159;box-sizing:border-box}.teams{font-size:2.6vw;font-weight:bold;flex:1}.details{font-size:1.5vw;color:#bcd0e8;text-align:right;min-width:20vw}.score{font-size:2.9vw;color:#ffda74;font-weight:bold;white-space:nowrap}.status{color:#8fe2b4}#empty{padding:5vw;font-size:2vw;color:#c6d5e9}.label{font-size:1.2vw;color:#bcd0e8}footer{position:fixed;bottom:0;right:1vw;color:#8192a9;font-size:0.8vw}button{background:#293f61;border:0;color:white;padding:10px;border-radius:6px;cursor:pointer}@media(max-width:650px){h1{font-size:6vw}.teams{font-size:5vw}.score{font-size:5vw}.details{font-size:3vw}#updated{font-size:2.5vw}}</style></head><body><header><h1>🏀 NCAA D-I MEN'S BASKETBALL</h1><div id="updated">Connecting to live scores…</div></header><div id="viewport"><div id="track"><div id="empty">Loading all Division I games…</div></div></div><footer>Data: ESPN public scoreboard endpoint · Updates every 60 seconds</footer><script>
// Public ESPN scoreboard endpoint is unofficial and may change or restrict browser access.
var API='https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?limit=500&groups=50';
var track=document.getElementById('track'), viewport=document.getElementById('viewport'), updated=document.getElementById('updated');var y=0,last=0,paused=false;
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(events){if(!events.length){track.innerHTML='<div id="empty">No Division I men\'s games listed today. The ticker will check again automatically.</div>';y=0;return}events.sort(function(a,b){var x=a.competitions[0].status.type.state,z=b.competitions[0].status.type.state;return ({in:0,pre:1,post:2}[x]||3)-({in:0,pre:1,post:2}[z]||3)});track.innerHTML=events.map(function(e){var c=e.competitions[0],teams=c.competitors||[],away=teams.filter(function(t){return t.homeAway==='away'})[0]||teams[0]||{},home=teams.filter(function(t){return t.homeAway==='home'})[0]||teams[1]||{};var s=c.status||e.status||{},type=s.type||{},network=(c.broadcasts||[]).map(function(b){return (b.names||[]).join(', ')}).filter(Boolean).join(' · ');var status=type.shortDetail||type.detail||'';var date=e.date?new Date(e.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';if(type.state==='pre')status=date+' · '+status;return '<div class="game"><div class="teams">'+escapeHtml(away.team&&away.team.displayName||'TBD')+'<div class="label">at</div>'+escapeHtml(home.team&&home.team.displayName||'TBD')+'</div><div class="score">'+(type.state==='pre'?'VS':escapeHtml((away.score||'0')+' – '+(home.score||'0')))+'</div><div class="details"><div class="status">'+escapeHtml(status)+'</div><div>'+escapeHtml(network||'TV network not listed')+'</div></div></div>'}).join('');y=0;track.style.transform='translateY(0px)'}
async function load(){try{var r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var d=await r.json();if(!Array.isArray(d.events))throw Error('Invalid response');render(d.events);updated.textContent='Updated '+new Date().toLocaleTimeString()+' · '+d.events.length+' games'}catch(e){updated.textContent='Unable to refresh live scores';if(!track.querySelector('.game'))track.innerHTML='<div id="empty">The free ESPN scores feed could not be reached by this browser. Try another browser or hosting setup. Details: '+escapeHtml(e.message)+'</div>'}}
function animate(t){if(!last)last=t;var dt=Math.min(100,t-last);last=t;if(!paused&&track.scrollHeight>viewport.clientHeight){y+=dt*.025;if(y>track.scrollHeight-viewport.clientHeight+120)y=0;track.style.transform='translateY('+(-y)+'px)'}requestAnimationFrame(animate)}document.addEventListener('visibilitychange',function(){paused=document.hidden});load();setInterval(load,60000);requestAnimationFrame(animate);
</script></body></html>
