name: HSN College Basketball Newswire
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect sourced basketball headlines
        run: python scripts/update_news.py
      - name: Commit news cache if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hsn-news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update HSN college basketball news'
            git push
          fi
